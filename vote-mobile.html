<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoteUI — fayf</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <!-- UI2610 POC. Decisions: .ai/adr/ui2610-adr-*.md · Requirements: .ai/ui2610/req.md -->
  <style>
    :root {
      --color-interactive-50:  #F0FDFA; --color-interactive-100: #CCFBF1; --color-interactive-400: #2DD4BF;
      --color-interactive-600: #0F766E; --color-interactive-700: #115E59; --color-interactive-accent: #14B8A6;
      --color-focus: #0F766E;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
    .muted { color: var(--color-neutral-600); font-size: var(--text-sm); }
    .row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    /* Button group (segmented): one frame, equal parts, one active (REQ-UI2610-32) */
    .seg { display: flex; border: 1px solid var(--color-interactive-600); border-radius: var(--radius-md); overflow: hidden; background: #fff; }
    .seg > button { flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; border-left: 1px solid var(--color-interactive-600); background: #fff; color: var(--color-interactive-700);
                    font: inherit; font-size: var(--text-sm); padding: 6px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg > button:first-child { border-left: 0; }
    .seg > button.active { background: var(--color-interactive-600); color: #fff; }
    .seg.rate { max-width: 260px; flex: 1; }
    /* Triage colours, one set per decision (REQ-UI2610-42): strong = stamp, ring, card border, button text/fill · light = card tint, button tint */
    :root { --tri-in: #16A34A; --tri-in-bg: #DCFCE7; --tri-out: #DC2626; --tri-out-bg: #FEE2E2; --tri-open: #CA8A04; --tri-open-bg: #FEF9C3; }
    .seg > button[data-tri][data-v="in"]   { background: var(--tri-in-bg);   color: #14532D; }
    .seg > button[data-tri][data-v="out"]  { background: var(--tri-out-bg);  color: #7F1D1D; }
    .seg > button[data-tri][data-v="open"] { background: var(--tri-open-bg); color: #713F12; }
    .seg > button[data-tri][data-v="in"].active   { background: var(--tri-in);   color: #fff; }
    .seg > button[data-tri][data-v="out"].active  { background: var(--tri-out);  color: #fff; }
    .seg > button[data-tri][data-v="open"].active { background: var(--tri-open); color: #422006; }
    #stack .card.swiping-right { border-left: 4px solid var(--tri-in);    background: var(--tri-in-bg); }
    #stack .card.swiping-left  { border-right: 4px solid var(--tri-out);  background: var(--tri-out-bg); }
    #stack .card.swiping-up    { border-top: 4px solid var(--tri-open);   background: var(--tri-open-bg); }
    #stack .card-tray-right { color: var(--tri-in); }
    #stack .card-tray-left  { color: var(--tri-out); }
    #stack .card-tray-up    { color: var(--tri-open); }
    /* while dragging: only the target button keeps its tint (others neutral); at the trigger point it fills */
    .tri:has(.card[class*="swiping-"]) .seg > button[data-tri] { background: #fff; color: var(--color-neutral-400); transition: background .12s, color .12s; }
    .tri:has(.card.swiping-right) .seg > button[data-v="in"]  { background: var(--tri-in-bg);   color: #14532D; }
    .tri:has(.card.swiping-left)  .seg > button[data-v="out"] { background: var(--tri-out-bg);  color: #7F1D1D; }
    .tri:has(.card.swiping-up)    .seg > button[data-v="open"]{ background: var(--tri-open-bg); color: #713F12; }
    .tri:has(.card.swiping-right.swipe-activate) .seg > button[data-v="in"]  { background: var(--tri-in);   color: #fff; }
    .tri:has(.card.swiping-left.swipe-activate)  .seg > button[data-v="out"] { background: var(--tri-out);  color: #fff; }
    .tri:has(.card.swiping-up.swipe-activate)    .seg > button[data-v="open"]{ background: var(--tri-open); color: #422006; }
    /* Nav: breadcrumb (topic) left · steps as action group right (REQ-UI2610-33) */
    .nav { padding-inline: var(--space-3); }
    #crumb { margin-right: auto; min-width: 0; flex: 1 1 auto; display: flex; align-items: center; gap: 2px; min-height: 44px; font-size: 13px; }
    #crumb button { background: none; border: 0; color: #fff; font: inherit; padding: 2px 1px; cursor: pointer; white-space: nowrap; min-width: 0; }
    #crumb .lvl { opacity: .75; overflow: hidden; text-overflow: ellipsis; max-width: 6ch; min-width: 2ch; flex: 0 6 auto; }   /* parents shrink first */
    #crumb .cur { font-weight: var(--font-weight-bold); overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
    #crumb .sep { opacity: .6; flex: none; }
    .topic-cards { display: flex; flex-direction: column; gap: var(--space-2); }
    .topic-card { display: flex; align-items: center; gap: var(--space-2); width: 100%; text-align: left; padding: var(--space-3) var(--space-4);
                  border: 1px solid var(--color-neutral-200); background: var(--color-surface-card, #fff); font: inherit; color: inherit; cursor: pointer; }
    .topic-card .chev { font-size: 24px; color: var(--color-interactive-600); flex: none; }
    .section-head { margin: var(--space-3) 0 0; font-size: var(--text-sm); color: var(--color-neutral-600); font-weight: var(--font-weight-bold); }
    .src { font-size: var(--text-xs); color: var(--color-neutral-600); }
    .quote { margin: 0 0 var(--space-1); padding-left: var(--space-2); border-left: 3px solid var(--color-interactive-100); font-size: var(--text-sm); color: var(--color-neutral-600); font-style: italic; }
    .src a { color: var(--color-interactive-700); }
    .nav .seg { border-color: rgba(255,255,255,.55); background: transparent; flex: none; }
    .nav .seg > button { flex: none; width: 36px; min-height: 34px; padding: 0; background: transparent; color: #fff; border-left-color: rgba(255,255,255,.55);
                         font-size: 17px; position: relative; overflow: visible; }
    .nav .seg > button.active { background: #fff; color: var(--color-interactive-700); }
    .nav .seg .tab-count { position: absolute; top: 1px; right: 1px;   /* inside the button: .seg clips overflow */ font-size: 10px; line-height: 14px; min-width: 14px; padding: 0 3px; border-radius: 7px;
                           background: #F59E0B; color: #14171A; opacity: 1; margin: 0; }
    .nav .seg .tab-count:empty { display: none; }
    .step-head { margin: 0; font-size: var(--text-base); font-weight: var(--font-weight-bold); }
    .topic-list button { width: 100%; justify-content: flex-start; }
    .tab-count { font-size: var(--text-xs); }
    .item-title { font-weight: var(--font-weight-bold); overflow-wrap: anywhere; }
    /* Indicator: icon(s) on top, label below (REQ-UI2610-36) */
    .ind-pair { display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; background: none; border: 0; padding: 2px; flex: none; }
    .ind-pair .icons { display: flex; align-items: flex-end; gap: 4px; }
    .ind-pair small { font-size: 11px; line-height: 1; color: var(--color-neutral-600); }
    svg.ind { display: block; background: #fff; }
    svg.ind.fit { outline: 2px solid var(--color-interactive-600); outline-offset: 2px; border-radius: 2px; }
    .ind-empty { width: 44px; height: 44px; border: 1px dashed var(--color-neutral-400); border-radius: 4px; display: grid; place-items: center; font-size: var(--text-xs); color: var(--color-neutral-600); }
    .chip.active { background: var(--color-interactive-600); color: #fff; border-color: var(--color-interactive-600); }
    .sign-chip { font-size: var(--text-xs); padding: 2px 8px; border-radius: var(--radius-full); background: var(--color-interactive-50); color: var(--color-interactive-700); }
    /* Triage stack */
    /* components.css gives every .card touch-action:none (for card-swipe) → no scrolling over cards on Android.
       Only the triage stack swipes; all other cards let a vertical drag scroll the page. */
    .card { touch-action: pan-y; }
    /* Triage stamps (REQ-UI2610-40): 1 neutral = hidden · 2 dragging = faint (reversible) · at trigger point = full */
    .stamp { position: absolute; top: 12px; padding: 2px 8px; border: 3px solid currentColor; border-radius: 6px; font-weight: 800; font-size: 15px;
             letter-spacing: .03em; opacity: 0; transition: opacity .12s, transform .12s; pointer-events: none; background: rgba(255,255,255,.85); }
    /* stamp sits on the edge that stays on screen: swipe right → stamp top-left, swipe left → top-right */
    .stamp-right { left: 12px;  color: var(--tri-in); transform: rotate(-10deg) scale(.9); }
    .stamp-left  { right: 12px; color: var(--tri-out); transform: rotate(10deg) scale(.9); }
    .stamp-up    { top: auto; bottom: 12px; left: 50%; color: var(--tri-open); transform: translateX(-50%) scale(.9); }
    .card.swiping-right .stamp-right, .card.swiping-left .stamp-left, .card.swiping-up .stamp-up { opacity: .4; }
    .card.swiping-right.swipe-activate .stamp-right { opacity: 1; transform: rotate(-10deg) scale(1.08); }
    .card.swiping-left.swipe-activate .stamp-left   { opacity: 1; transform: rotate(10deg) scale(1.08); }
    .card.swiping-up.swipe-activate .stamp-up       { opacity: 1; transform: translateX(-50%) scale(1.08); }
    /* Toast stages: pending (amber, countdown, undo) → committed (green ✓) */
    .toast.toast-pending { border-left: 4px solid #F59E0B; position: relative; overflow: hidden; }
    .toast.toast-pending .bar { position: absolute; left: 0; bottom: 0; height: 3px; background: #F59E0B; width: 100%; animation: drain linear forwards; }
    @keyframes drain { to { width: 0; } }
    #stack .card { touch-action: none; min-height: 160px; display: flex; flex-direction: column; justify-content: center; }
    /* Fine-tune pair */
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .pair .card { cursor: pointer; min-height: 140px; }
    /* Overview */
    .rank { font-variant-numeric: tabular-nums; font-weight: var(--font-weight-bold); width: 2ch; text-align: right; }
    .hist { font-size: var(--text-xs); color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
    /* Editor */
    #editor-grid { width: 100%; max-width: 320px; aspect-ratio: 1; touch-action: none; display: block; margin: 0 auto; user-select: none; background: #fff; border: 1px solid var(--color-neutral-200); }
    .axis { font-size: var(--text-xs); color: var(--color-neutral-600); display: flex; justify-content: space-between; gap: var(--space-2); width: 100%; max-width: 320px; margin: 0 auto; }
    #toast-container { position: fixed; top: var(--space-4); right: var(--space-4); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--space-2); }
    #toast-container .toast { position: static; }
    .toast button { margin-left: var(--space-2); }
    .sheet-header { display: flex; align-items: center; gap: var(--space-2); }
    .sheet-header h3 { flex: 1; margin: 0; font-size: var(--text-base); }
    .bottom-sheet { max-height: 92dvh; overflow-y: auto; }
    .fab[hidden] { display: none; }
  </style>
</head>
<body>
<nav class="nav">
  <div id="crumb" aria-label="Themenpfad"></div>
  <div class="seg" id="tab-bar" role="tablist" aria-label="Schritte">
    <button data-step="triage" title="1 Sichten" aria-label="1 Sichten">⇆<span class="tab-count" id="cnt-triage"></span></button>
    <button data-step="rate" title="2 Bewerten" aria-label="2 Bewerten">★<span class="tab-count" id="cnt-rate"></span></button>
    <button data-step="tune" title="3 Feinschliff" aria-label="3 Feinschliff">⚖<span class="tab-count" id="cnt-tune"></span></button>
    <button data-step="over" title="Übersicht" aria-label="Übersicht">☰</button>
  </div>
</nav>

<main id="view"></main>
<div id="toast-container"></div>

<button id="fab" class="fab" aria-label="Eintrag hinzufügen" hidden>+</button>

<div id="sheet-backdrop" class="overlay-backdrop">
  <div id="sheet" class="bottom-sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="assets/entry-core.js"></script>
<script src="assets/card-swipe.js"></script>
<script src="assets/ui2610-core.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let tenantId = "", baseRoot = "/", topicRoot = "/", sid = "www";   // base = cfg folder holding the topics
let entries = {};          // GET /entries (json)
let votes = {};            // GET /votes  (json, with `sets`)
let step = "triage";
let newOnly = false;       // Triage: only Items without own Triage
let myName = "";
const TID_RE = /^[a-zA-Z0-9_-]{1,30}$/;
const TRI_LABEL = { in: "Relevant", open: "Später", out: "Egal" };   // UI labels for In / Open / Out (REQ-UI2610-40)
const TRI_ICON = { in: "✓", open: "↑", out: "✗" };
const UNDO_MS = 4000;

// ── Model access ──────────────────────────────────────────────────────────────
const nodeId  = key => key.slice(key.lastIndexOf("/") + 1);
const itemKey = id => fullKey(topicRoot, id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function itemIds() {
    const prefix = topicRoot === "/" ? "/" : topicRoot + "/";
    return Object.keys(entries)
        .filter(k => k.startsWith(prefix) && !k.slice(prefix.length).includes("/") && !k.includes("~") && !isTopicEntry(entries[k]))
        .sort((a, b) => (entries[a].timestamp || "").localeCompare(entries[b].timestamp || ""))
        .map(nodeId);
}
const titleOf = id => stripTypeSuffix((entries[itemKey(id)] || {}).message || id);
function setOf(path, kind) { return ((votes[path] || {}).sets || {})[kind] || {}; }
const own    = (path, kind) => setOf(path, kind)[sid];
const others = (path, kind) => setOf(path, kind).others || "";
const attrOf = (path, a) => ((votes[path] || {}).attrs || {})[a] || "";

function setOwnLocal(path, kind, value) {
    votes[path] = votes[path] || { attrs: {}, sets: {} };
    votes[path].sets = votes[path].sets || {};
    votes[path].sets[kind] = votes[path].sets[kind] || {};
    if (value === null) delete votes[path].sets[kind][sid]; else votes[path].sets[kind][sid] = value;
}

function trustedSet() {
    const pre = topicRoot.replace(/\/$/, "") + "/~trust/";
    return new Set(Object.keys(votes).filter(k => k.startsWith(pre) && own(k, "trust") === "1").map(k => k.slice(pre.length)));
}
function cmpMap() {
    const pre = topicRoot.replace(/\/$/, "") + "/~cmp/", out = {};
    for (const k of Object.keys(votes)) {
        if (!k.startsWith(pre)) continue;
        const h = parseHist(others(k, "cmp")), o = own(k, "cmp");
        if (o !== undefined) h[o] = (h[o] || 0) + 1;
        out[k.slice(pre.length)] = h;
    }
    return out;
}
const pairPath = (a, b) => topicRoot.replace(/\/$/, "") + "/~cmp/" + pairKey(a, b);

function indOf(id) {
    const p = itemKey(id);
    const eff = effectiveInd(own(p, "ind"), ((entries[p] || {}).attrs || {}).ind_default);   // own, else seed default (REQ-UI2610-36)
    const mine = eff.ind;
    const group = groupInd(mine, parseIndHist(others(p, "ind")));
    return { mine, group, isDefault: eff.isDefault };
}
function statsOf(id) { const p = itemKey(id); return ratingStats(own(p, "rate"), others(p, "rate")); }
function ranked() { return rank(itemIds().map(id => ({ id, mean: statsOf(id).mean })), cmpMap(), 15); }

// ── POST (optimistic; caller reverts on false) ────────────────────────────────
async function postVotes(path, attrs, content) {
    const line = `${path} | ${attrs.join(" | ")} | ${content}`;
    try {
        const res = await fetch("votes?" + new URLSearchParams({ sid, tid: tenantId }), { method: "POST", body: new URLSearchParams({ entry: line }) });
        if (!res.ok) {
            console.error("[ui2610] POST votes non-ok:", res.status, (await res.text()).slice(0, 500), "line:", line);   // CA16
            showToast("Konnte nicht gespeichert werden. Bitte erneut versuchen.", "error");                              // CA15
            return false;
        }
        return true;
    } catch (err) {
        console.error("[ui2610] POST votes:", err, "line:", line);
        showToast("Verbindung unterbrochen. Bitte erneut versuchen.", "error");
        return false;
    }
}
function saveSet(id, kind, value, extra = []) {
    const p = itemKey(id), prev = own(p, kind) ?? null;
    setOwnLocal(p, kind, value);
    render();
    return postVotes(p, [`${kind}:${sid}:${value}`, ...extra], (entries[p] || {}).message || "Item.")
        .then(ok => { if (!ok) { setOwnLocal(p, kind, prev); render(); } return ok; });
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showToast(message, type = "info", duration = 3000, action = null) {
    const el = document.createElement("div");
    el.className = "toast toast-" + type;
    el.textContent = message;
    if (action) {
        const b = document.createElement("button");
        b.className = "btn btn-ghost"; b.textContent = action.label;
        b.onclick = () => { action.run(); el.remove(); };
        el.appendChild(b);
    }
    document.getElementById("toast-container").appendChild(el);
    setTimeout(() => el.remove(), duration);
}

/** Card icon: group Indicator; own one beside it unless Fit (then one, highlighted). */
const IND_SIZE = 44, IND_OWN_SIZE = 28;
function indHtml(id) {
    const { mine, group, isDefault } = indOf(id);
    const btn = (aria, icons, label) => `<button class="ind-pair" data-edit="${id}" aria-label="${aria}"><span class="icons">${icons}</span><small>${label}</small></button>`;
    if (!group) return btn("Indikator setzen", `<span class="ind-empty">+</span>`, "setzen");
    // "guess" = seed default (ind_default), the Voter has not set an own value yet
    if (mine && isFit(mine, group)) return btn(isDefault ? "Indikator: Schätzwert" : "Indikator: Fit", iconSvg(group, { size: IND_SIZE, fit: !isDefault }), isDefault ? "guess" : "Fit");
    return btn("Indikator", iconSvg(group, { size: IND_SIZE }) + (mine ? iconSvg(mine, { size: IND_OWN_SIZE }) : ""), mine ? (isDefault ? "guess" : "Gruppe · ich") : "Gruppe");
}
function signsHtml(id) {
    const p = itemKey(id);
    return visibleSigns(attrOf(p, "signers"), attrOf(p, "names"), trustedSet(), sid)
        .map(s => `<span class="sign-chip">✍ ${s.sid === sid ? "ich" : esc(s.name)}</span>`).join(" ");
}
function rateChips(id) {
    const r = own(itemKey(id), "rate");
    return `<div class="seg rate" role="group" aria-label="Bewertung">` + [1, 2, 3, 4, 5].map(n =>
        `<button class="${String(n) === r ? "active" : ""}" data-rate="${id}" data-v="${n}">${n}</button>`).join("") + `</div>`;
}
function signBtn(id) {
    const p = itemKey(id);
    if (!own(p, "rate") || own(p, "rate") === "0") return "";
    const signed = attrOf(p, "signers").split(",").includes(sid);
    return `<button class="chip${signed ? " active" : ""}" data-sign="${id}">${signed ? "✍ signiert" : "✍ signieren"}</button>`;
}

// ── Step sets ─────────────────────────────────────────────────────────────────
function triageIds() {
    return itemIds().filter(id => { const t = own(itemKey(id), "tri"); return newOnly ? t === undefined : t === undefined || t === "open"; });
}
const rateIds = () => itemIds().filter(id => own(itemKey(id), "tri") !== "out");
function tuneList() {
    return rateIds().map(id => ({ id, r: parseInt(own(itemKey(id), "rate"), 10) || null }))
        .filter(x => x.r).sort((a, b) => b.r - a.r).slice(0, 15);
}
function nextPair() {
    const compared = {};
    for (const k of Object.keys(votes)) if (k.includes("/~cmp/") && own(k, "cmp") !== undefined) compared[k.slice(k.indexOf("/~cmp/") + 6)] = 1;
    const list = tuneList(), pairs = nextPairs(list, compared, 1);
    return pairs.length && !compared[pairKey(...pairs[0])] ? pairs[0] : null;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
    document.querySelectorAll("#tab-bar button").forEach(c => c.classList.toggle("active", c.dataset.step === step));
    renderTopics();
    const nT = triageIds().length, nR = rateIds().filter(id => !own(itemKey(id), "rate")).length;
    document.getElementById("cnt-triage").textContent = nT ? String(nT) : "";
    document.getElementById("cnt-rate").textContent = nR ? String(nR) : "";
    document.getElementById("cnt-tune").textContent = nextPair() ? "•" : "";
    const v = document.getElementById("view");
    const head = { triage: "1 Sichten", rate: "2 Bewerten", tune: "3 Feinschliff", over: "Übersicht" }[step];
    const body = ({ triage: viewTriage, rate: viewRate, tune: viewTune, over: viewOver })[step]();
    const topics = subTopicsHtml();
    // no own Items here → topic cards are the content (top); else Items first, sub-topics below
    v.innerHTML = `<h2 class="step-head">${head}</h2>` + (!itemIds().length && step !== "over"   // Overview keeps Name + Trust
        ? (topics ? `<p class="muted">Thema wählen:</p>` + topics : body)
        : body + (topics ? `<h3 class="section-head">Unterthemen</h3>` + topics : ""));
    const stack = document.getElementById("stack");
    if (stack) {
        // buttons inside the card (Indicator) keep their tap: card-swipe.js would capture the pointer and swallow the click
        stack.addEventListener("pointerdown", e => { if (e.target.closest("button")) e.stopPropagation(); }, true);
        initCardSwipe(stack, { relock: true });   // overshoot to the other side switches the decision (REQ-UI2610-41)
    }
}

function viewTriage() {
    const ids = triageIds();
    const filter = `<div class="row"><span class="grow muted">${ids.length} zu sichten · relevant zum Bewerten?</span>
        <button class="chip chip-filter${newOnly ? " active" : ""}" data-act="newonly">nur neue</button></div>`;
    if (!ids.length) return filter + `<p class="muted">Alles gesichtet. <button class="btn btn-ghost" data-go="rate">Weiter: Bewerten →</button></p>`;
    const id = ids[0];
    const t = own(itemKey(id), "tri");
    return filter + `<div class="tri"><div id="stack"><div class="card" data-tri-card="${id}"><div class="card-body">
            <div class="row"><span class="item-title grow">${esc(titleOf(id))}</span>${indHtml(id)}</div>
            ${t === "open" ? `<span class="muted">bisher: Später</span>` : ""}
        </div>
        <span class="stamp stamp-right" aria-hidden="true">RELEVANT ✓</span>

    else if (d.act === "close") closeSheet();
    else if (d.act === "newonly") { newOnly = !newOnly; render(); }
    else if (d.act === "name") {
        const v = document.getElementById("my-name").value.trim();
        if (v && !/^[^|;=,]{1,40}$/.test(v)) { showToast("Name: max. 40 Zeichen, ohne | ; = ,", "error"); return; }
        myName = v; saveSettings({ ui2610Name: v }); showToast("Name gespeichert.", "success", 1500);
    }
    else if (d.act === "ind-save") {
        if (!editor || !editor.draft) { closeSheet(); return; }
        const id = editor.id; saveSet(id, "ind", formatInd(editor.draft)); closeSheet();
    }
    else if (d.act === "add-save") saveAdd();
    else if (d.act === "topic-new") openTopicNew();
    else if (d.act === "topics") openTopics();
    else if (d.act === "reload") { closeSheet(); loadData(); }
    else if (d.act === "topic-save") saveTopicNew();
}

// ── Data + settings ───────────────────────────────────────────────────────────
async function jsonOrEmpty(res) { const t = await res.text(); return t.trim() ? JSON.parse(t) : {}; }
async function loadData() {
    const url = r => r + "?" + new URLSearchParams({ sid, tid: tenantId, format: "json" });
    try {
        const [eRes, vRes] = await Promise.all([fetch(url("entries")), fetch(url("votes"))]);
        if (!eRes.ok || !vRes.ok) throw new Error(`entries ${eRes.status} / votes ${vRes.status}`);
        entries = await jsonOrEmpty(eRes);
        votes = await jsonOrEmpty(vRes);
        render();
        document.getElementById("fab").hidden = false;
    } catch (err) {
        console.error("[ui2610] loadData:", err);                                                // CA16
        showToast("Daten konnten nicht geladen werden. Bitte Seite neu laden.", "error", 5000);    // CA15
    }
}
function loadSettings() { try { return JSON.parse(localStorage.getItem("fayf_settings") || "{}"); } catch { return {}; } }
function saveSettings(patch) { try { localStorage.setItem("fayf_settings", JSON.stringify({ ...loadSettings(), ...patch })); } catch { /* private mode */ } }
function ensureSid(s) {
    if (s.sid) return s.sid;
    const fresh = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    saveSettings({ sid: fresh });
    return fresh;
}

async function init() {
    document.body.addEventListener("click", onClick);
    document.getElementById("view").addEventListener("cardswipe:action", e => {
        const id = e.target.closest("[data-tri-card]")?.dataset.triCard;
        const v = { right: "in", left: "out", up: "open" }[e.detail.direction];
        if (id && v) triage(id, v, true);
    });
    document.getElementById("fab").addEventListener("click", openAdd);
    document.getElementById("sheet-backdrop").addEventListener("click", e => { if (e.target.id === "sheet-backdrop") closeSheet(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
    let cfg = {};
    try { cfg = await (await fetch("config.php")).json(); } catch (err) { console.warn("[ui2610] config.php:", err); }
    const params = new URLSearchParams(location.search);
    tenantId  = params.get("tid") || cfg.voteMobileTid || "";
    const norm = t => (t || "").replace(/\/+$/, "") || "/";
    const settings = loadSettings();
    baseRoot  = norm(params.get("base") || cfg.voteMobileTopic || "/");
    topicRoot = norm(params.get("topic") || settings.ui2610Topic || baseRoot);
    if (topicRoot !== baseRoot && !topicRoot.startsWith(baseRoot === "/" ? "/" : baseRoot + "/") && !params.get("topic")) topicRoot = baseRoot;   // stale setting from another base
    if (STEPS.includes(params.get("step"))) step = params.get("step");
    history.replaceState({ topic: topicRoot, step }, "", navUrl(topicRoot, step));   // first history entry
    sid = ensureSid(settings);
    myName = settings.ui2610Name || "";
    const title = cfg.voteMobileTitle || "Abstimmen";
    baseTitle = title;   // breadcrumb root
    document.title = title + " — fayf";
    if (!TID_RE.test(tenantId)) {
        console.error("[ui2610] invalid tid:", JSON.stringify(tenantId));
        showToast("Kein gültiger Bereich angegeben. Bitte den Link prüfen.", "error", 8000);
        return;
    }
    render();
    await loadData();
}
init();
</script>
