<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VoteUI — fayf</title>
  <link rel="icon" href="assets/favicon.ico">
  <link rel="stylesheet" href="assets/design-tokens.css">
  <link rel="stylesheet" href="assets/components.css">
  <!-- UI2610 POC. Decisions: .ai/adr/ui2610-adr-*.md · Requirements: .ai/ui2610/req.md -->
  <style>
    :root {
      --color-interactive-50:  #F0FDFA; --color-interactive-100: #CCFBF1; --color-interactive-400: #2DD4BF;
      --color-interactive-600: #0F766E; --color-interactive-700: #115E59; --color-interactive-accent: #14B8A6;
      --color-focus: #0F766E;
    }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    main { flex: 1; width: 100%; max-width: 640px; margin: 0 auto; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
    .muted { color: var(--color-neutral-600); font-size: var(--text-sm); }
    .row { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
    .grow { flex: 1; min-width: 0; }
    /* Button group (segmented): one frame, equal parts, one active (REQ-UI2610-32) */
    .seg { display: flex; border: 1px solid var(--color-interactive-600); border-radius: var(--radius-md); overflow: hidden; background: #fff; }
    .seg > button { flex: 1 1 0; min-width: 0; min-height: 40px; border: 0; border-left: 1px solid var(--color-interactive-600); background: #fff; color: var(--color-interactive-700);
                    font: inherit; font-size: var(--text-sm); padding: 6px 4px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .seg > button:first-child { border-left: 0; }
    .seg > button.active { background: var(--color-interactive-600); color: #fff; }
    .seg.rate { max-width: 260px; flex: 1; }
    /* Nav: breadcrumb (topic) left · steps as action group right (REQ-UI2610-33) */
    .nav { padding-inline: var(--space-3); }
    #crumb { margin-right: auto; min-width: 0; max-width: 55%; background: none; border: 0; color: #fff; font: inherit; font-size: var(--text-sm);
             display: flex; align-items: center; gap: 4px; min-height: 44px; cursor: pointer; padding: 0; }
    #crumb .base { opacity: .75; white-space: nowrap; }
    #crumb .topic { font-weight: var(--font-weight-bold); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nav .seg { border-color: rgba(255,255,255,.55); background: transparent; flex: none; }
    .nav .seg > button { flex: none; width: 42px; min-height: 34px; padding: 0; background: transparent; color: #fff; border-left-color: rgba(255,255,255,.55);
                         font-size: 17px; position: relative; overflow: visible; }
    .nav .seg > button.active { background: #fff; color: var(--color-interactive-700); }
    .nav .seg .tab-count { position: absolute; top: -6px; right: -4px; font-size: 10px; line-height: 14px; min-width: 14px; padding: 0 3px; border-radius: 7px;
                           background: #F59E0B; color: #14171A; opacity: 1; margin: 0; }
    .nav .seg .tab-count:empty { display: none; }
    .step-head { margin: 0; font-size: var(--text-base); font-weight: var(--font-weight-bold); }
    .topic-list button { width: 100%; justify-content: flex-start; }
    .tab-count { font-size: var(--text-xs); }
    .item-title { font-weight: var(--font-weight-bold); overflow-wrap: anywhere; }
    .ind-pair { display: flex; align-items: center; gap: 4px; cursor: pointer; background: none; border: 0; padding: 2px; }
    .ind-pair small { font-size: 10px; color: var(--color-neutral-600); }
    svg.ind { display: block; background: #fff; }
    svg.ind.fit { outline: 2px solid var(--color-interactive-600); outline-offset: 2px; border-radius: 2px; }
    .ind-empty { width: 32px; height: 32px; border: 1px dashed var(--color-neutral-400); border-radius: 4px; display: grid; place-items: center; font-size: var(--text-xs); color: var(--color-neutral-600); }
    .chip.active { background: var(--color-interactive-600); color: #fff; border-color: var(--color-interactive-600); }
    .sign-chip { font-size: var(--text-xs); padding: 2px 8px; border-radius: var(--radius-full); background: var(--color-interactive-50); color: var(--color-interactive-700); }
    /* Triage stack */
    #stack .card { touch-action: none; min-height: 160px; display: flex; flex-direction: column; justify-content: center; }
    /* Fine-tune pair */
    .pair { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
    .pair .card { cursor: pointer; min-height: 140px; }
    /* Overview */
    .rank { font-variant-numeric: tabular-nums; font-weight: var(--font-weight-bold); width: 2ch; text-align: right; }
    .hist { font-size: var(--text-xs); color: var(--color-neutral-600); font-variant-numeric: tabular-nums; }
    /* Editor */
    #editor-grid { width: 100%; max-width: 320px; aspect-ratio: 1; touch-action: none; display: block; margin: 0 auto; user-select: none; background: #fff; border: 1px solid var(--color-neutral-200); }
    .axis { font-size: var(--text-xs); color: var(--color-neutral-600); display: flex; justify-content: space-between; gap: var(--space-2); width: 100%; max-width: 320px; margin: 0 auto; }
    #toast-container { position: fixed; top: var(--space-4); right: var(--space-4); z-index: var(--z-toast); display: flex; flex-direction: column; gap: var(--space-2); }
    #toast-container .toast { position: static; }
    .toast button { margin-left: var(--space-2); }
    .sheet-header { display: flex; align-items: center; gap: var(--space-2); }
    .sheet-header h3 { flex: 1; margin: 0; font-size: var(--text-base); }
    .bottom-sheet { max-height: 92dvh; overflow-y: auto; }
    .fab[hidden] { display: none; }
  </style>
</head>
<body>
<nav class="nav">
  <button id="crumb" data-act="topics" aria-label="Thema wechseln"><span class="base" id="nav-title">VoteUI</span><span class="base">›</span><span class="topic" id="crumb-topic">…</span><span>▾</span></button>
  <div class="seg" id="tab-bar" role="tablist" aria-label="Schritte">
    <button data-step="triage" title="1 Sichten" aria-label="1 Sichten">⇆<span class="tab-count" id="cnt-triage"></span></button>
    <button data-step="rate" title="2 Bewerten" aria-label="2 Bewerten">★<span class="tab-count" id="cnt-rate"></span></button>
    <button data-step="tune" title="3 Feinschliff" aria-label="3 Feinschliff">⚖<span class="tab-count" id="cnt-tune"></span></button>
    <button data-step="over" title="Übersicht" aria-label="Übersicht">☰</button>
  </div>
</nav>

<main id="view"></main>
<div id="toast-container"></div>

<button id="fab" class="fab" aria-label="Eintrag hinzufügen" hidden>+</button>

<div id="sheet-backdrop" class="overlay-backdrop">
  <div id="sheet" class="bottom-sheet" role="dialog" aria-modal="true"></div>
</div>

<script src="assets/entry-core.js"></script>
<script src="assets/card-swipe.js"></script>
<script src="assets/ui2610-core.js"></script>
<script>
// ── State ─────────────────────────────────────────────────────────────────────
let tenantId = "", baseRoot = "/", topicRoot = "/", sid = "www";   // base = cfg folder holding the topics
let entries = {};          // GET /entries (json)
let votes = {};            // GET /votes  (json, with `sets`)
let step = "triage";
let newOnly = false;       // Triage: only Items without own Triage
let myName = "";
const TID_RE = /^[a-zA-Z0-9_-]{1,30}$/;
const TRI_LABEL = { in: "Relevant", open: "Offen", out: "Raus" };   // UI labels for In / Open / Out
const UNDO_MS = 4000;

// ── Model access ──────────────────────────────────────────────────────────────
const nodeId  = key => key.slice(key.lastIndexOf("/") + 1);
const itemKey = id => fullKey(topicRoot, id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function itemIds() {
    const prefix = topicRoot === "/" ? "/" : topicRoot + "/";
    return Object.keys(entries)
        .filter(k => k.startsWith(prefix) && !k.slice(prefix.length).includes("/") && !k.includes("~") && !isTopicEntry(entries[k]))
        .sort((a, b) => (entries[a].timestamp || "").localeCompare(entries[b].timestamp || ""))
        .map(nodeId);
}
const titleOf = id => stripTypeSuffix((entries[itemKey(id)] || {}).message || id);
function setOf(path, kind) { return ((votes[path] || {}).sets || {})[kind] || {}; }
const own    = (path, kind) => setOf(path, kind)[sid];
const others = (path, kind) => setOf(path, kind).others || "";
const attrOf = (path, a) => ((votes[path] || {}).attrs || {})[a] || "";

function setOwnLocal(path, kind, value) {
    votes[path] = votes[path] || { attrs: {}, sets: {} };
    votes[path].sets = votes[path].sets || {};
    votes[path].sets[kind] = votes[path].sets[kind] || {};
    if (value === null) delete votes[path].sets[kind][sid]; else votes[path].sets[kind][sid] = value;
}

function trustedSet() {
    const pre = topicRoot.replace(/\/$/, "") + "/~trust/";
    return new Set(Object.keys(votes).filter(k => k.startsWith(pre) && own(k, "trust") === "1").map(k => k.slice(pre.length)));
}
function cmpMap() {
    const pre = topicRoot.replace(/\/$/, "") + "/~cmp/", out = {};
    for (const k of Object.keys(votes)) {
        if (!k.startsWith(pre)) continue;
        const h = parseHist(others(k, "cmp")), o = own(k, "cmp");
        if (o !== undefined) h[o] = (h[o] || 0) + 1;
        out[k.slice(pre.length)] = h;
    }
    return out;
}
const pairPath = (a, b) => topicRoot.replace(/\/$/, "") + "/~cmp/" + pairKey(a, b);

function indOf(id) {
    const p = itemKey(id);
    const mine = parseInd(own(p, "ind"));
    const group = groupInd(mine, parseIndHist(others(p, "ind")));
    return { mine, group };
}
function statsOf(id) { const p = itemKey(id); return ratingStats(own(p, "rate"), others(p, "rate")); }
function ranked() { return rank(itemIds().map(id => ({ id, mean: statsOf(id).mean })), cmpMap(), 15); }

// ── POST (optimistic; caller reverts on false) ────────────────────────────────
async function postVotes(path, attrs, content) {
    const line = `${path} | ${attrs.join(" | ")} | ${content}`;
    try {
        const res = await fetch("votes?" + new URLSearchParams({ sid, tid: tenantId }), { method: "POST", body: new URLSearchParams({ entry: line }) });
        if (!res.ok) {
            console.error("[ui2610] POST votes non-ok:", res.status, (await res.text()).slice(0, 500), "line:", line);   // CA16
            showToast("Konnte nicht gespeichert werden. Bitte erneut versuchen.", "error");                              // CA15
            return false;
        }
        return true;
    } catch (err) {
        console.error("[ui2610] POST votes:", err, "line:", line);
        showToast("Verbindung unterbrochen. Bitte erneut versuchen.", "error");
        return false;
    }
}
function saveSet(id, kind, value, extra = []) {
    const p = itemKey(id), prev = own(p, kind) ?? null;
    setOwnLocal(p, kind, value);
    render();
    return postVotes(p, [`${kind}:${sid}:${value}`, ...extra], (entries[p] || {}).message || "Item.")
        .then(ok => { if (!ok) { setOwnLocal(p, kind, prev); render(); } return ok; });
}

// ── UI helpers ────────────────────────────────────────────────────────────────
function showToast(message, type = "info", duration = 3000, action = null) {
    const el = document.createElement("div");
    el.className = "toast toast-" + type;
    el.textContent = message;
    if (action) {
        const b = document.createElement("button");
        b.className = "btn btn-ghost"; b.textContent = action.label;
        b.onclick = () => { action.run(); el.remove(); };
        el.appendChild(b);
    }
    document.getElementById("toast-container").appendChild(el);
    setTimeout(() => el.remove(), duration);
}

/** Card icon: group Indicator; own one beside it unless Fit (then one, highlighted). */
function indHtml(id) {
    const { mine, group } = indOf(id);
    if (!group) return `<button class="ind-pair" data-edit="${id}" aria-label="Indikator setzen"><span class="ind-empty">+</span></button>`;
    if (mine && isFit(mine, group)) return `<button class="ind-pair" data-edit="${id}" aria-label="Indikator (Fit)">${iconSvg(group, { fit: true })}<small>Fit</small></button>`;
    return `<button class="ind-pair" data-edit="${id}" aria-label="Indikator">${iconSvg(group)}`
        + (mine ? `<small>ich</small>${iconSvg(mine, { size: 20 })}` : `<small>+</small>`) + `</button>`;
}
function signsHtml(id) {
    const p = itemKey(id);
    return visibleSigns(attrOf(p, "signers"), attrOf(p, "names"), trustedSet(), sid)
        .map(s => `<span class="sign-chip">✍ ${s.sid === sid ? "ich" : esc(s.name)}</span>`).join(" ");
}
function rateChips(id) {
    const r = own(itemKey(id), "rate");
    return `<div class="seg rate" role="group" aria-label="Bewertung">` + [1, 2, 3, 4, 5].map(n =>
        `<button class="${String(n) === r ? "active" : ""}" data-rate="${id}" data-v="${n}">${n}</button>`).join("") + `</div>`;
}
function signBtn(id) {
    const p = itemKey(id);
    if (!own(p, "rate") || own(p, "rate") === "0") return "";
    const signed = attrOf(p, "signers").split(",").includes(sid);
    return `<button class="chip${signed ? " active" : ""}" data-sign="${id}">${signed ? "✍ signiert" : "✍ signieren"}</button>`;
}

// ── Step sets ─────────────────────────────────────────────────────────────────
function triageIds() {
    return itemIds().filter(id => { const t = own(itemKey(id), "tri"); return newOnly ? t === undefined : t === undefined || t === "open"; });
}
const rateIds = () => itemIds().filter(id => own(itemKey(id), "tri") !== "out");
function tuneList() {
    return rateIds().map(id => ({ id, r: parseInt(own(itemKey(id), "rate"), 10) || null }))
        .filter(x => x.r).sort((a, b) => b.r - a.r).slice(0, 15);
}
function nextPair() {
    const compared = {};
    for (const k of Object.keys(votes)) if (k.includes("/~cmp/") && own(k, "cmp") !== undefined) compared[k.slice(k.indexOf("/~cmp/") + 6)] = 1;
    const list = tuneList(), pairs = nextPairs(list, compared, 1);
    return pairs.length && !compared[pairKey(...pairs[0])] ? pairs[0] : null;
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
    document.querySelectorAll("#tab-bar button").forEach(c => c.classList.toggle("active", c.dataset.step === step));
    renderTopics();
    const nT = triageIds().length, nR = rateIds().filter(id => !own(itemKey(id), "rate")).length;
    document.getElementById("cnt-triage").textContent = nT ? String(nT) : "";
    document.getElementById("cnt-rate").textContent = nR ? String(nR) : "";
    document.getElementById("cnt-tune").textContent = nextPair() ? "•" : "";
    const v = document.getElementById("view");
    const head = { triage: "1 Sichten", rate: "2 Bewerten", tune: "3 Feinschliff", over: "Übersicht" }[step];
    v.innerHTML = `<h2 class="step-head">${head}</h2>` + ({ triage: viewTriage, rate: viewRate, tune: viewTune, over: viewOver })[step]();
    const stack = document.getElementById("stack");
    if (stack) {
        // buttons inside the card (Indicator) keep their tap: card-swipe.js would capture the pointer and swallow the click
        stack.addEventListener("pointerdown", e => { if (e.target.closest("button")) e.stopPropagation(); }, true);
        initCardSwipe(stack, {});
    }
}

function viewTriage() {
    const ids = triageIds();
    const filter = `<div class="row"><span class="grow muted">${ids.length} zu sichten · relevant zum Bewerten?</span>
        <button class="chip chip-filter${newOnly ? " active" : ""}" data-act="newonly">nur neue</button></div>`;
    if (!ids.length) return filter + `<p class="muted">Alles gesichtet. <button class="btn btn-ghost" data-go="rate">Weiter: Bewerten →</button></p>`;
    const id = ids[0];
    const t = own(itemKey(id), "tri");
    return filter + `<div id="stack"><div class="card" data-tri-card="${id}"><div class="card-body">
            <div class="row"><span class="item-title grow">${esc(titleOf(id))}</span>${indHtml(id)}</div>
            ${t === "open" ? `<span class="muted">bisher: Offen</span>` : ""}
        </div></div></div>
        <div class="seg" role="group" aria-label="Sichten">
            <button data-tri="${id}" data-v="out">← Raus</button>
            <button class="${t === "open" ? "active" : ""}" data-tri="${id}" data-v="open">Offen</button>
            <button data-tri="${id}" data-v="in">Relevant →</button>
        </div><p class="muted">Wischen: rechts = Relevant · links = Raus · hoch = Offen</p>`;
}

function itemCard(id, body) {
    return `<div class="card"><div class="card-body">
        <div class="row"><span class="item-title grow" data-open="${id}">${esc(titleOf(id))}</span>${indHtml(id)}</div>${body}</div></div>`;
}

function viewRate() {
    const ids = rateIds();
    if (!ids.length) return `<p class="muted">Nichts zu bewerten. Erst sichten.</p>`;
    return ids.map(id => {
        const s = statsOf(id);
        return itemCard(id, `<div class="row">${rateChips(id)}${signBtn(id)}</div>
            <div class="row muted">${s.n ? `Ø ${s.mean.toFixed(1)} · ${s.n} Stimmen` : "noch keine Stimmen"} ${signsHtml(id)}</div>`);
    }).join("") + `<button class="btn btn-ghost" data-go="tune">Weiter: Feinschliff →</button>`;
}

function viewTune() {
    const pair = nextPair();
    if (!pair) return `<p class="muted">Keine offenen Vergleiche. Erst ≥ 2 Einträge mit gleicher/naher Bewertung.</p>
        <button class="btn btn-ghost" data-go="over">Zur Übersicht →</button>`;
    const [a, b] = pair, card = (id, v) => `<div class="card" data-cmp="${v}" data-a="${a}" data-b="${b}"><div class="card-body">
        <div class="item-title">${esc(titleOf(id))}</div><div class="muted">meine Bewertung ${own(itemKey(id), "rate")}</div>${indHtml(id)}</div></div>`;
    return `<p class="muted">Was ist wichtiger?</p><div class="pair">${card(a, 1)}${card(b, -1)}</div>
        <button class="btn btn-secondary" data-cmp="0" data-a="${a}" data-b="${b}">Gleich wichtig</button>`;
}

function viewOver() {
    const rows = ranked().map((x, i) => {
        const p = itemKey(x.id), t = parseHist(others(p, "tri")), mt = own(p, "tri");
        if (mt) t[mt] = (t[mt] || 0) + 1;
        const s = statsOf(x.id);
        return `<div class="card" data-open="${x.id}"><div class="card-body row">
            <span class="rank">${x.mean === null ? "–" : i + 1}</span>
            <span class="grow"><span class="item-title">${esc(titleOf(x.id))}</span><br>
              <span class="hist">${s.n ? "Ø " + s.mean.toFixed(1) + " (" + s.n + ")" : "–"} · ✓${t.in || 0} ?${t.open || 0} ✗${t.out || 0}
              · ich: ${mt ? TRI_LABEL[mt] : "–"}${own(p, "rate") ? " / " + own(p, "rate") : ""}</span> ${signsHtml(x.id)}</span>
            ${indHtml(x.id)}</div></div>`;
    }).join("");
    const trusted = trustedSet(), signers = {};
    for (const k of Object.keys(votes)) {
        const names = {};
        attrOf(k, "names").split(";").forEach(s => { const i = s.indexOf("="); if (i > 0) names[s.slice(0, i)] = s.slice(i + 1); });
        attrOf(k, "signers").split(",").filter(Boolean).forEach(s => { if (s !== sid) signers[s] = names[s] || signers[s] || "#" + s; });
    }
    const trustRows = Object.entries(signers).map(([s, n]) =>
        `<button class="chip${trusted.has(s) ? " active" : ""}" data-trust="${s}">${trusted.has(s) ? "✓ " : ""}${esc(n)}</button>`).join(" ");
    return `<p class="muted">Gruppen-Rangliste · Tippen = Eintrag ändern</p>${rows || '<p class="muted">Keine Einträge.</p>'}
        <div class="card"><div class="card-body">
          <label class="form-label" for="my-name">Mein Name (für Signaturen)</label>
          <div class="row"><input id="my-name" class="input grow" maxlength="40" value="${esc(myName)}" placeholder="z. B. Mart">
          <button class="btn btn-secondary" data-act="name">OK</button></div>
          <p class="form-label">Ich vertraue (Signaturen sichtbar):</p><div class="row">${trustRows || '<span class="muted">noch keine Unterzeichner</span>'}</div>
        </div></div>`;
}

// ── Topics (REQ-UI2610-31) ───────────────────────────────────────────────────
function topicOptions() {
    const list = topicsOf(entries, baseRoot);
    const loose = (() => { const keep = topicRoot; topicRoot = baseRoot; const n = itemIds().length; topicRoot = keep; return n; })();
    if (loose || !list.length) list.unshift({ key: baseRoot, title: list.length ? "(ohne Thema)" : "Allgemein" });
    if (!list.some(t => t.key === topicRoot)) list.push({ key: topicRoot, title: nodeId(topicRoot) || topicRoot });
    return list;
}
function renderTopics() {
    const t = topicOptions().find(x => x.key === topicRoot);
    document.getElementById("crumb-topic").textContent = t ? t.title : topicRoot;
}
function openTopics() {
    openSheet(sheetHead("Thema") + `<div class="topic-list" style="display:flex;flex-direction:column;gap:6px">${topicOptions().map(t =>
        `<button class="btn ${t.key === topicRoot ? "btn-primary" : "btn-secondary"}" data-topic="${esc(t.key)}">${t.key === topicRoot ? "✓ " : ""}${esc(t.title)}</button>`).join("")}</div>
        <div class="row" style="justify-content:space-between"><button class="btn btn-ghost" data-act="reload">↻ Neu laden</button>
        <button class="btn btn-primary" data-act="topic-new">+ Thema</button></div>`);
}
function switchTopic(key) {
    if (key === topicRoot) return;
    topicRoot = key;
    saveSettings({ ui2610Topic: key });
    const url = new URL(location.href); url.searchParams.set("topic", key); history.replaceState(null, "", url);   // shareable link
    if (step === "tune" || step === "over") step = "triage";
    render();
}
function openTopicNew() {
    openSheet(sheetHead("Neues Thema") + `<label class="form-label" for="topic-name">Name</label>
        <input id="topic-name" class="input" maxlength="40" placeholder="z. B. Klima, Rente">
        <p class="muted">Jedes Thema hat eigene Einträge, Vergleiche und Vertrauen.</p>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" data-act="topic-save">Anlegen</button></div>`);
    document.getElementById("topic-name").focus();
}
async function saveTopicNew() {
    const name = document.getElementById("topic-name").value.trim().replace(/\s*\|\s*/g, " / ");
    const slug = slugify(name);
    if (!slug) { showToast("Bitte einen Namen mit Buchstaben oder Ziffern eingeben.", "error"); return; }
    const key = fullKey(baseRoot, slug);
    if (entries[key]) { closeSheet(); switchTopic(key); showToast("Thema gibt es schon — gewechselt.", "info", 2000); return; }
    const message = /[.!?>-]$/.test(name) ? name : name + ".";
    try {
        const res = await fetch("entries?" + new URLSearchParams({ sid, tid: tenantId }), { method: "POST", body: new URLSearchParams({ entry: `${key} | kind:topic | ${message}` }) });
        if (!res.ok) { console.error("[ui2610] POST topic:", res.status, (await res.text()).slice(0, 500)); showToast("Thema konnte nicht angelegt werden.", "error"); return; }
        const json = await res.json().catch(() => ({}));
        entries[key] = { timestamp: json.timestamp || "", message, attrs: { kind: "topic" } };
        closeSheet(); switchTopic(key); showToast(`Thema „${name}“ angelegt.`, "success", 1500);
    } catch (err) { console.error("[ui2610] POST topic:", err); showToast("Verbindung unterbrochen.", "error"); }
}

// ── Sheets: Item (jump back) · Indicator editor · add ─────────────────────────
function openSheet(html) {
    document.getElementById("sheet").innerHTML = html;
    document.getElementById("sheet-backdrop").classList.add("open");
    document.getElementById("sheet").classList.add("open");
}
function closeSheet() {
    document.getElementById("sheet-backdrop").classList.remove("open");
    document.getElementById("sheet").classList.remove("open");
    editor = null;
}
const sheetHead = t => `<div class="sheet-header"><h3>${esc(t)}</h3><button class="btn-icon" data-act="close" aria-label="Schließen">✕</button></div>`;

function openItem(id) {
    const p = itemKey(id), t = own(p, "tri");
    openSheet(sheetHead(titleOf(id)) + `
        <p class="form-label">Sichten</p><div class="seg" role="group" aria-label="Sichten">${["out", "open", "in"].map(v =>
            `<button class="${t === v ? "active" : ""}" data-tri="${id}" data-v="${v}" data-stay="1">${TRI_LABEL[v]}</button>`).join("")}</div>
        <p class="form-label">Bewerten</p><div class="row">${rateChips(id)}${signBtn(id)}</div>
        <p class="form-label">Indikator</p><div class="row">${indHtml(id)}<button class="btn btn-ghost" data-edit="${id}">bearbeiten</button></div>`);
    sheetItem = id;
}
let sheetItem = null;

let editor = null;   // { id, core, lo, hi, draft }
const P_LBL = ["10 %", "30 %", "50 %", "70 %", "90 %"], I_LBL = ["marginal", "spürbar", "erheblich", "schwer", "existenziell"];
function openEditor(id) {
    const { mine } = indOf(id);
    editor = { id, core: null, lo: null, hi: null, draft: mine };
    openSheet(sheetHead("Indikator: " + titleOf(id)) + `
        <p class="muted">Tippen = Kern · ziehen weitet die Streuung (links-unten, dann rechts-oben) · gestrichelt = Gruppe</p>
        <div class="row" style="justify-content:center"><span class="muted" style="writing-mode:vertical-rl;transform:rotate(180deg)">Auswirkung →</span>
          <svg id="editor-grid" viewBox="0 0 5 5" shape-rendering="crispEdges"></svg></div>
        <div class="axis"><span>10 %</span><span>Eintrittswahrscheinlichkeit →</span><span>90 %</span></div>
        <p id="editor-info" class="muted"></p>
        <div class="row" style="justify-content:flex-end">
          <button class="btn btn-ghost" data-act="close">Abbrechen</button>
          <button class="btn btn-primary" data-act="ind-save">Speichern</button></div>`);
    const svg = document.getElementById("editor-grid");
    const at = e => { const r = svg.getBoundingClientRect(); return cellAt((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); };
    svg.addEventListener("pointerdown", e => {
        svg.setPointerCapture(e.pointerId);
        editor.core = at(e); editor.lo = editor.hi = null;
        editor.draft = dragInd(editor.core, null, null); drawEditor();
    });
    svg.addEventListener("pointermove", e => {
        if (!editor || !editor.core || !svg.hasPointerCapture(e.pointerId)) return;
        const c = at(e), k = editor.core, same = c.kP === k.kP && c.kI === k.kI;
        // within one drag σ only grows: the way back to the upper right must not shrink σ− (new tap resets)
        if (!same && c.kP <= k.kP && c.kI <= k.kI && !editor.hi) editor.lo = growLo(editor.lo, c);
        else if (!same && c.kP >= k.kP && c.kI >= k.kI) editor.hi = growHi(editor.hi, c);
        editor.draft = dragInd(k, editor.lo, editor.hi); drawEditor();
    });
    drawEditor();
}
function drawEditor() {
    const svg = document.getElementById("editor-grid");
    if (!svg || !editor) return;
    const p = itemKey(editor.id);
    const group = groupInd(editor.draft, parseIndHist(others(p, "ind")));
    // Low noise (ADR-4): own value = one solid box like the icon; group = one dashed outline; no nested squares
    let s = "";
    if (editor.draft) { const m = magnitudeRect(editor.draft); s += `<rect x="${m.x}" y="${m.y}" width="${m.w}" height="${m.h}" fill="${MAGNITUDE}"/>`; }
    if (editor.draft) for (let kI = 0; kI < 5; kI++) for (let kP = 0; kP < 5; kP++) {
        const st = cellStyle(editor.draft, kP, kI);
        if (st) s += `<rect x="${kP}" y="${4 - kI}" width="1" height="1" fill="${st.fill}" fill-opacity="${st.opacity}"/>`;
    }
    for (let i = 1; i < 5; i++) s += `<line x1="${i}" y1="0" x2="${i}" y2="5" stroke="#000" stroke-opacity=".08" stroke-width=".02"/><line x1="0" y1="${i}" x2="5" y2="${i}" stroke="#000" stroke-opacity=".08" stroke-width=".02"/>`;
    if (group && !isFit(editor.draft, group)) {
        const b = boxRect(group);
        s += `<rect x="${b.x + .04}" y="${b.y + .04}" width="${b.w - .08}" height="${b.h - .08}" fill="none" stroke="#5A6069" stroke-width=".04" stroke-dasharray=".12 .08"/>`;
    }
    svg.innerHTML = s;
    const d = editor.draft;
    document.getElementById("editor-info").textContent = d
        ? `P ${P_LBL[d.kP]} (−${d.sPm}/+${d.sPp}) · Auswirkung ${I_LBL[d.kI]} (−${d.sIm}/+${d.sIp})${isFit(d, group) ? " · ✓ Fit mit Gruppe" : ""}`
        : "Noch kein eigener Wert — tippe in die Matrix.";
}

function openAdd() {
    openSheet(sheetHead("Neuer Eintrag") + `<label class="form-label" for="add-text">Text</label>
        <textarea id="add-text" class="textarea" maxlength="300" placeholder="Was soll bewertet werden?"></textarea>
        <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" data-act="add-save">Hinzufügen</button></div>`);
    document.getElementById("add-text").focus();
}
async function saveAdd() {
    const text = document.getElementById("add-text").value.trim().replace(/\s*\|\s*/g, " / ");
    if (text.length < 3) { showToast("Bitte mindestens 3 Zeichen eingeben.", "error"); return; }
    let id = generateNodeId();
    while (entries[itemKey(id)]) id = generateNodeId();
    const message = /[.!?>-]$/.test(text) ? text : text + ".";
    try {
        const res = await fetch("entries?" + new URLSearchParams({ sid, tid: tenantId }), { method: "POST", body: new URLSearchParams({ entry: `${itemKey(id)} | ${message}` }) });
        if (!res.ok) { console.error("[ui2610] POST entries:", res.status, (await res.text()).slice(0, 500)); showToast("Eintrag konnte nicht gespeichert werden.", "error"); return; }
        const json = await res.json().catch(() => ({}));
        entries[itemKey(id)] = { timestamp: json.timestamp || "", message, attrs: {} };
        closeSheet(); render(); showToast("Eintrag hinzugefügt!", "success", 1500);
    } catch (err) { console.error("[ui2610] POST entries:", err); showToast("Verbindung unterbrochen.", "error"); }
}

// ── Actions ───────────────────────────────────────────────────────────────────
let pendingTri = null;   // delayed POST so "Rückgängig" can cancel (append-only store)
function triage(id, v, delayed) {
    const p = itemKey(id), prev = own(p, "tri") ?? null;
    if (pendingTri) { clearTimeout(pendingTri.timer); pendingTri.commit(); }
    setOwnLocal(p, "tri", v); render(); refreshSheet();
    const commit = () => { pendingTri = null; postVotes(p, [`tri:${sid}:${v}`], (entries[p] || {}).message || "Item.").then(ok => { if (!ok) { setOwnLocal(p, "tri", prev); render(); } }); };
    if (!delayed) return commit();
    pendingTri = { commit, timer: setTimeout(commit, UNDO_MS) };
    showToast(`${TRI_LABEL[v]}: ${titleOf(id)}`, "info", UNDO_MS, { label: "Rückgängig", run: () => {
        clearTimeout(pendingTri.timer); pendingTri = null; setOwnLocal(p, "tri", prev); render();
    } });
}
function sign(id) {
    const p = itemKey(id), list = attrOf(p, "signers").split(",").filter(Boolean), on = !list.includes(sid);
    votes[p] = votes[p] || { attrs: {}, sets: {} };
    votes[p].attrs = votes[p].attrs || {};
    const before = votes[p].attrs.signers;
    votes[p].attrs.signers = (on ? list.concat(sid) : list.filter(s => s !== sid)).join(",");
    render(); refreshSheet();
    const attrs = [`signed:${sid}:${on ? 1 : 0}`];
    if (on && myName) attrs.push(`by:${myName}`);
    if (on && !myName) showToast("Tipp: Namen in der Übersicht setzen, sonst erscheint #Kennung.", "info", 4000);
    postVotes(p, attrs, (entries[p] || {}).message || "Item.").then(ok => { if (!ok) { votes[p].attrs.signers = before; render(); } });
}
function compare(a, b, v) {
    const p = pairPath(a, b), val = a < b ? v : -v;   // stored for canonical a~b order
    setOwnLocal(p, "cmp", String(val)); render();
    postVotes(p, [`cmp:${sid}:${val}`], "Vergleich.").then(ok => { if (!ok) { setOwnLocal(p, "cmp", null); render(); } });
}
function trust(s) {
    const p = topicRoot.replace(/\/$/, "") + "/~trust/" + s, on = own(p, "trust") !== "1";
    setOwnLocal(p, "trust", on ? "1" : "0"); render();
    postVotes(p, [`trust:${sid}:${on ? 1 : 0}`], "Vertrauen.").then(ok => { if (!ok) { setOwnLocal(p, "trust", on ? "0" : "1"); render(); } });
}
function refreshSheet() { if (sheetItem && document.getElementById("sheet").classList.contains("open") && !editor) openItem(sheetItem); }

function onClick(e) {
    const t = e.target.closest("[data-tri],[data-rate],[data-sign],[data-cmp],[data-trust],[data-edit],[data-open],[data-go],[data-act],[data-step],[data-topic]");
    if (!t) return;
    const d = t.dataset;
    if (d.step) { step = d.step; render(); }
    else if (d.topic) { closeSheet(); switchTopic(d.topic); }
    else if (d.go) { step = d.go; render(); }
    else if (d.tri) triage(d.tri, d.v, !d.stay);
    else if (d.rate) { saveSet(d.rate, "rate", own(itemKey(d.rate), "rate") === d.v ? "0" : d.v).then(refreshSheet); refreshSheet(); }
    else if (d.sign) sign(d.sign);
    else if (d.cmp !== undefined && d.a) compare(d.a, d.b, parseInt(d.cmp, 10));
    else if (d.trust) trust(d.trust);
    else if (d.edit) openEditor(d.edit);
    else if (d.open) openItem(d.open);
    else if (d.act === "close") closeSheet();
    else if (d.act === "newonly") { newOnly = !newOnly; render(); }
    else if (d.act === "name") {
        const v = document.getElementById("my-name").value.trim();
        if (v && !/^[^|;=,]{1,40}$/.test(v)) { showToast("Name: max. 40 Zeichen, ohne | ; = ,", "error"); return; }
        myName = v; saveSettings({ ui2610Name: v }); showToast("Name gespeichert.", "success", 1500);
    }
    else if (d.act === "ind-save") {
        if (!editor || !editor.draft) { closeSheet(); return; }
        const id = editor.id; saveSet(id, "ind", formatInd(editor.draft)); closeSheet();
    }
    else if (d.act === "add-save") saveAdd();
    else if (d.act === "topic-new") openTopicNew();
    else if (d.act === "topics") openTopics();
    else if (d.act === "reload") { closeSheet(); loadData(); }
    else if (d.act === "topic-save") saveTopicNew();
}

// ── Data + settings ───────────────────────────────────────────────────────────
async function jsonOrEmpty(res) { const t = await res.text(); return t.trim() ? JSON.parse(t) : {}; }
async function loadData() {
    const url = r => r + "?" + new URLSearchParams({ sid, tid: tenantId, format: "json" });
    try {
        const [eRes, vRes] = await Promise.all([fetch(url("entries")), fetch(url("votes"))]);
        if (!eRes.ok || !vRes.ok) throw new Error(`entries ${eRes.status} / votes ${vRes.status}`);
        entries = await jsonOrEmpty(eRes);
        votes = await jsonOrEmpty(vRes);
        const topics = topicsOf(entries, baseRoot);
        if (topicRoot === baseRoot && topics.length && !itemIds().length) topicRoot = topics[0].key;   // start in the first topic
        render();
        document.getElementById("fab").hidden = false;
    } catch (err) {
        console.error("[ui2610] loadData:", err);                                                // CA16
        showToast("Daten konnten nicht geladen werden. Bitte Seite neu laden.", "error", 5000);    // CA15
    }
}
function loadSettings() { try { return JSON.parse(localStorage.getItem("fayf_settings") || "{}"); } catch { return {}; } }
function saveSettings(patch) { try { localStorage.setItem("fayf_settings", JSON.stringify({ ...loadSettings(), ...patch })); } catch { /* private mode */ } }
function ensureSid(s) {
    if (s.sid) return s.sid;
    const fresh = "v" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    saveSettings({ sid: fresh });
    return fresh;
}

async function init() {
    document.body.addEventListener("click", onClick);
    document.getElementById("view").addEventListener("cardswipe:action", e => {
        const id = e.target.closest("[data-tri-card]")?.dataset.triCard;
        const v = { right: "in", left: "out", up: "open" }[e.detail.direction];
        if (id && v) triage(id, v, true);
    });
    document.getElementById("fab").addEventListener("click", openAdd);
    document.getElementById("sheet-backdrop").addEventListener("click", e => { if (e.target.id === "sheet-backdrop") closeSheet(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
    let cfg = {};
    try { cfg = await (await fetch("config.php")).json(); } catch (err) { console.warn("[ui2610] config.php:", err); }
    const params = new URLSearchParams(location.search);
    tenantId  = params.get("tid") || cfg.voteMobileTid || "";
    const norm = t => (t || "").replace(/\/+$/, "") || "/";
    const settings = loadSettings();
    baseRoot  = norm(params.get("base") || cfg.voteMobileTopic || "/");
    topicRoot = norm(params.get("topic") || settings.ui2610Topic || baseRoot);
    if (topicRoot !== baseRoot && !topicRoot.startsWith(baseRoot === "/" ? "/" : baseRoot + "/") && !params.get("topic")) topicRoot = baseRoot;   // stale setting from another base
    sid = ensureSid(settings);
    myName = settings.ui2610Name || "";
    const title = cfg.voteMobileTitle || "Abstimmen";
    document.getElementById("nav-title").textContent = title;   // breadcrumb root
    document.title = title + " — fayf";
    if (!TID_RE.test(tenantId)) {
        console.error("[ui2610] invalid tid:", JSON.stringify(tenantId));
        showToast("Kein gültiger Bereich angegeben. Bitte den Link prüfen.", "error", 8000);
        return;
    }
    render();
    await loadData();
}
init();
</script>
